name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 'lts/*']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node --test
      - run: node tools/check.mjs
        env:
          GRITTYFX_BUDGET_MS: 4

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v6
      # The gallery imports ../src/, so the site keeps the repo layout; the root page sends visitors on to gallery/.
      - run: |
          mkdir _site
          cp -r gallery src _site/
          node tools/list.mjs --json > _site/gallery/fx-list.json
          echo '<!doctype html><meta http-equiv="refresh" content="0; url=gallery/"><a href="gallery/">gallery</a>' > _site/index.html
      # an artifact per attempt: a re-run would otherwise find the failed attempt's too, and refuse to pick one
      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
      # GitHub can list a new artifact seconds late, and deploy-pages looks only once: wait (up to 2 min) until it's listed
      - run: |
          for i in $(seq 60); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].name' | grep -qx "github-pages-$GITHUB_RUN_ATTEMPT" && exit 0
            sleep 2
          done
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
      - id: deploy
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
